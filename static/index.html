<!DOCTYPE html>
<html>

<head>

<title>REBOT AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#111111">

<!-- Google Sign-In Library -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

body{
font-family:Arial;
background:#111;
color:white;
margin:0;
display:flex;
flex-direction:column;
height:100vh;
height:100dvh;
-webkit-user-select:none;
user-select:none;
-webkit-tap-highlight-color:transparent;
}

h2{
text-align:center;
background:#1a1a1a;
padding:10px;
margin:0;
font-size:18px;
flex-shrink:0;
}

#top-bar{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 10px;
background:#1a1a1a;
gap:8px;
flex-shrink:0;
border-bottom:1px solid #333;
}

#user-info{
display:flex;
align-items:center;
gap:8px;
min-width:0;
flex:1;
}

#user-avatar{
width:36px;
height:36px;
border-radius:50%;
object-fit:cover;
background:#333;
border:2px solid #00ffcc;
display:block;
flex-shrink:0;
}

#chat{
flex:1;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
padding:10px;
display:flex;
flex-direction:column;
gap:6px;
background:#0a0a0a;
width:100%;
}

.message{
max-width:85%;
padding:8px 12px;
border-radius:12px;
margin-bottom:0;
word-wrap:break-word;
font-size:14px;
line-height:1.4;
}

.user{
background:#00ffcc;
color:black;
margin-left:auto;
align-self:flex-end;
}

.bot{
background:#2a2a2a;
color:white;
margin-right:auto;
align-self:flex-start;
}

.input-area-container {
display: flex;
gap: 8px;
padding: 10px;
background: #1a1a1a;
border-top: 1px solid #333;
align-items: flex-end;
flex-shrink: 0;
width:100%;
box-sizing:border-box;
}

#attachedFilesPreview {
padding: 6px 10px;
background: #1a1a1a;
display: flex;
flex-wrap: wrap;
gap: 5px;
min-height: auto;
max-height: 120px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
border-top: 1px solid #333;
flex-shrink:0;
width:100%;
box-sizing:border-box;
}

#attachedFilesPreview:empty {
display: none;
}

.attached-file {
display: flex;
align-items: center;
gap: 5px;
background: #2a2a2a;
padding: 5px 8px;
border-radius: 5px;
font-size: 11px;
animation: slideIn 0.3s ease;
}

.attached-file .file-icon {
width: 16px;
height: 16px;
border-radius: 2px;
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
font-size: 7px;
flex-shrink: 0;
color: #000;
}

.attached-file .file-icon.pdf {
background: #ff6b6b;
}

.attached-file .file-icon.txt {
background: #4ecdc4;
}

.attached-file .file-icon.docx {
background: #45b7d1;
}

.attached-file .file-name {
color: #fff;
max-width: 100px;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
font-size: 11px;
}

.attached-file .remove-file {
background: none;
border: none;
color: #999;
cursor: pointer;
padding: 0;
font-size: 12px;
display: flex;
align-items: center;
transition: color 0.2s;
min-width: 20px;
min-height: 20px;
justify-content: center;
}

.attached-file .remove-file:active {
color: #ff6b6b;
}

.attach-btn {
background: transparent;
border: 1px solid #444;
color: #00ffcc;
padding: 8px 10px;
border-radius: 6px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s ease;
flex-shrink: 0;
min-width: 44px;
min-height: 44px;
}

.attach-btn:active {
background: #2a2a2a;
border-color: #00ffcc;
}

.msg-input {
flex: 1;
min-width: 0;
padding: 10px 12px;
border: 1px solid #444;
border-radius: 6px;
background: #2a2a2a;
color: #fff;
font-size: 14px;
transition: all 0.2s ease;
min-height: 44px;
-webkit-appearance: none;
appearance: none;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

.msg-input:focus {
outline: none;
border-color: #00ffcc;
background: #333;
}

.msg-input::placeholder {
color: #666;
}

.send-btn {
background: #00ffcc;
color: #000;
border: none;
padding: 8px 10px;
border-radius: 6px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
transition: all 0.2s ease;
flex-shrink: 0;
min-width: 44px;
min-height: 44px;
}

.send-btn:active {
background: #00ccaa;
transform: scale(0.95);
}

@keyframes slideIn {
from {
opacity: 0;
transform: translateY(-10px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

input[type="file"]{
padding:6px;
}

button{
padding:12px 18px;
border:none;
background:#00ffcc;
color:black;
font-weight:bold;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#00ccaa;
}

.logout-btn{
background:#ff5555;
color:white;
padding:8px 10px;
font-size:12px;
min-width:44px;
min-height:44px;
white-space:nowrap;
}

.logout-btn:active{
background:#ff2222;
}

/* LOGIN MODAL */

.modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background-color:rgba(0,0,0,0.8);
}

.modal.active{
display:flex;
align-items:center;
justify-content:center;
}

.modal-content{
background:#1a1a1a;
padding:30px 20px;
border-radius:12px;
width:90%;
max-width:450px;
box-shadow:0 4px 6px rgba(0,0,0,0.3);
text-align:center;
}

.modal-content h2{
text-align:center;
margin-top:0;
background:none;
padding:0;
color:#00ffcc;
font-size:24px;
margin-bottom:10px;
}

.modal-content p{
text-align:center;
color:#aaa;
margin-bottom:20px;
font-size:14px;
}

#googleSignInButton{
display:flex;
justify-content:center;
margin-bottom:20px;
}

.loading-spinner{
display:inline-block;
width:16px;
height:16px;
border:2px solid #aaa;
border-top:2px solid #00ffcc;
border-radius:50%;
animation:spin 1s linear infinite;
margin-right:8px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

#main-content{
display:none;
flex:1;
overflow:hidden;
display:flex;
flex-direction:column;
width:100%;
max-width:100%;
}

#main-content.active{
display:flex;
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

#loader h1{
color:#00ffcc;
letter-spacing:2px;
font-size:28px;
margin:0;
}

#loader p{
color:#aaa;
margin-top:10px;
font-size:13px;
}

/* MOBILE RESPONSIVE */
@media (max-width: 480px) {
  h2 {
    font-size: 16px;
    padding: 8px;
  }

  #top-bar {
    padding: 6px 8px;
    gap: 6px;
  }

  #user-avatar {
    width: 32px;
    height: 32px;
  }

  #user-info {
    gap: 6px;
  }

  #user-info > div {
    min-width: 0;
  }

  #userName {
    font-size: 12px;
  }

  #userEmail {
    font-size: 10px;
  }

  #chat {
    padding: 8px;
    gap: 4px;
  }

  .message {
    max-width: 90%;
    padding: 6px 10px;
    font-size: 13px;
    margin-bottom: 0;
  }

  #attachedFilesPreview {
    padding: 4px 8px;
    gap: 4px;
    max-height: 100px;
  }

  .attached-file {
    padding: 4px 6px;
    gap: 4px;
    font-size: 10px;
  }

  .attached-file .file-icon {
    width: 14px;
    height: 14px;
    font-size: 6px;
  }

  .attached-file .file-name {
    max-width: 80px;
    font-size: 10px;
  }

  .attach-btn {
    padding: 8px 8px;
    min-width: 44px;
    min-height: 44px;
    display: none;
  }

  .attach-btn svg {
    width: 18px;
    height: 18px;
  }

  .msg-input {
    padding: 8px 8px;
    font-size: 13px;
    min-height: 40px;
    max-width: 100%;
  }

  .send-btn {
    padding: 6px 8px;
    min-width: 40px;
    min-height: 40px;
    flex-shrink: 0;
  }

  .input-area-container {
    padding: 6px;
    gap: 4px;
  }

  .send-btn svg {
    width: 16px;
    height: 16px;
  }

  .logout-btn {
    padding: 6px 8px;
    font-size: 11px;
    min-height: 40px;
    min-width: auto;
  }

  input[type="file"] {
    padding: 4px;
  }

  button {
    padding: 10px 14px;
    font-size: 14px;
  }

  .modal-content {
    padding: 20px 16px;
  }

  .modal-content h2 {
    font-size: 20px;
  }

  .modal-content p {
    font-size: 13px;
    margin-bottom: 16px;
  }

  #loader h1 {
    font-size: 24px;
    letter-spacing: 1px;
  }

  #loader p {
    font-size: 12px;
  }
}

/* EXTRA SMALL SCREENS */
@media (max-width: 359px) {
  .input-area-container {
    padding: 4px;
    gap: 3px;
  }

  .attach-btn {
    display: none;
  }

  .msg-input {
    padding: 6px 6px;
    font-size: 12px;
    min-height: 36px;
  }

  .send-btn {
    min-width: 36px;
    min-height: 36px;
    padding: 4px 6px;
    flex-shrink: 0;
  }

  .send-btn svg {
    width: 14px;
    height: 14px;
  }
}

/* TABLET & DESKTOP */
@media (min-width: 481px) {
  #main-content {
    align-items: center;
  }

  h2 {
    font-size: 20px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
    padding: 12px 20px;
  }

  #top-bar {
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
    padding: 10px 20px;
  }

  #chat {
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    padding: 15px 20px;
  }

  #attachedFilesPreview {
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
    padding: 8px 20px;
  }

  .input-area-container {
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
    padding: 10px 20px;
    gap: 10px;
  }

  .message {
    max-width: 75%;
    padding: 10px 14px;
    font-size: 14px;
  }

  .msg-input {
    padding: 10px 12px;
    min-height: 44px;
    font-size: 14px;
  }

  .send-btn {
    padding: 10px 14px;
    min-width: 44px;
    min-height: 44px;
  }
}

</style>

</head>

<script>
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("/static/sw.js")
.then(function() {
console.log("Service Worker Registered");
});
}
</script>

<body>

<!-- Loading Screen -->
<div id="loader">
<h1>🤖 REBOT AI</h1>
<p>Initializing...</p>
</div>

<!-- Login Modal -->
<div id="authModal" class="modal active">
<div class="modal-content">
<h2>🤖 REBOT AI</h2>
<p>Sign in with your Google account to continue</p>

<div id="googleSignInButton">
<!-- Google Sign-In button will be rendered here -->
</div>

<p style="color:#888; font-size:12px; margin-top:20px;">
Your data is private and secure. We only use your Google account for authentication.
</p>
</div>
</div>

<!-- Main Chat Content -->
<div id="main-content">
<h2>🤖 REBOT AI</h2>

<div id="top-bar">
<div id="user-info">
<img id="user-avatar" src="" alt="Avatar" crossorigin="anonymous" referrerpolicy="no-referrer">
<div>
<div id="userName" style="color:#00ffcc; font-weight:bold;">User</div>
<div id="userEmail" style="color:#aaa; font-size:12px;">user@example.com</div>
</div>
</div>
<div>
<button class="logout-btn" onclick="handleLogout()">Sign Out</button>
</div>
</div>

<div id="chat"></div>

<!-- Attached Files Preview -->
<div id="attachedFilesPreview" class="attached-files-preview"></div>

<!-- Input Area with File Attachment -->
<div class="input-area-container">
<!-- Attach File Button -->
<button id="attachBtn" class="attach-btn" title="Attach file">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 0 19.8 4.3M22 12.5a10 10 0 0 0-19.8-4.2"></path>
</svg>
</button>
<input type="file" id="fileUpload" accept=".pdf,.txt,.docx" multiple style="display:none;">

<!-- Text Input -->
<input type="text" id="msg" placeholder="Ask REBOT..." class="msg-input">

<!-- Send Button -->
<button onclick="send()" class="send-btn">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
<path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16346273 C3.34915502,0.9 2.40734225,0.9 1.77946707,1.4429026 C0.994623095,2.0000606 0.837654326,3.0910075 1.15159189,3.88935502 L3.03521743,10.3303481 C3.03521743,10.4874455 3.34915502,10.6445429 3.50612381,10.6445429 L16.6915026,11.4300299 C16.6915026,11.4300299 17.1624089,11.4300299 17.1624089,11.0589049 L17.1624089,12.0014893 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"></path>
</svg>
</button>
</div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
